<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>ITK LYTE Management</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:auto;padding-bottom:50px}
header{background:#080808;border-bottom:3px solid #e21b2d;padding:17px 18px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:900;letter-spacing:2px;font-size:21px}.red{color:#e21b2d}
.header-btn{background:#171717;color:#fff;border:1px solid #333;border-radius:9px;padding:8px 10px;font-size:12px}
.hero{margin:16px 16px 20px;background:linear-gradient(135deg,#111,#0b0b0b);border:1px solid #303030;border-left:6px solid #e21b2d;border-radius:18px;padding:22px;box-shadow:0 12px 30px #000}
.hello{font-size:24px;margin:0 0 20px}.small{color:#aaa;font-size:12px}.balance{font-size:30px;font-weight:900;margin-top:7px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.stat{background:#171717;border:1px solid #292929;border-radius:12px;padding:12px}.stat b{display:block;font-size:17px;margin-top:4px}
h2{font-size:18px;margin:22px 16px 11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:0 16px}
.tile{min-height:116px;border:1px solid #303030;border-radius:15px;background:#141414;color:#fff;padding:16px 9px;font-weight:800;font-size:15px;text-align:center;box-shadow:inset 0 -4px 0 #e21b2d}
.tile:active,.primary:active,.danger:active{transform:scale(.98)}.ico{font-size:31px;display:block;margin-bottom:11px}
.business{margin:0 16px 10px;border:1px solid #292929;border-radius:14px;background:#111;padding:14px;display:flex;align-items:center;gap:11px}
.bicon{width:46px;height:46px;flex:0 0 46px;border-radius:12px;background:#e21b2d18;border:1px solid #e21b2d;display:grid;place-items:center;color:#e21b2d;font-weight:900}
.bname{font-weight:800}.bmeta{font-size:11px;color:#999;margin-top:5px}.amount{margin-left:auto;text-align:right;font-size:13px}.share{color:#e21b2d;font-weight:800;font-size:12px;margin-top:4px}
.overlay{position:fixed;inset:0;background:#000c;display:none;z-index:20;align-items:flex-end}
.sheet{width:100%;max-width:760px;margin:auto;max-height:91vh;overflow:auto;background:#111;border-top:3px solid #e21b2d;border-radius:22px 22px 0 0;padding:19px}
.close{float:right;border:0;border-radius:50%;background:#292929;color:#fff;width:35px;height:35px;font-size:20px}.sheet h3{font-size:22px;margin:8px 0 17px}.muted{color:#999;font-size:12px}
.back{background:#292929;color:#fff;border:0;border-radius:9px;padding:9px 13px;margin-bottom:10px}.primary,.danger{width:100%;padding:12px;color:#fff;border:0;border-radius:10px;font-weight:800;margin-top:8px}.primary{background:#e21b2d}.danger{background:#55131a;border:1px solid #e21b2d}
input,select{width:100%;padding:12px;background:#090909;color:#fff;border:1px solid #444;border-radius:9px;margin:5px 0 10px}
label{font-size:12px;color:#bbb}.item{background:#181818;border:1px solid #292929;border-radius:12px;padding:14px;margin:9px 0}.item b{display:block;margin-bottom:5px}
.row{display:flex;gap:9px}.row>*{flex:1}.mini{background:#222;color:#fff;border:1px solid #444;border-radius:8px;padding:8px;font-size:12px}
.file{border-top:1px solid #333;padding:11px 0}.upload{display:block;text-align:center;background:#e21b2d;color:#fff;padding:11px;border-radius:9px;font-weight:800;font-size:12px;margin:10px 0}
.empty{padding:22px;text-align:center;color:#888;border:1px dashed #333;border-radius:12px}
.badge{display:inline-block;border:1px solid #e21b2d;color:#e21b2d;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:800}
.tx{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #292929}.tx:last-child{border-bottom:0}
.plus{color:#55d98b}.minus{color:#ff6977}
@media(max-width:430px){.grid{gap:8px}.tile{min-height:108px}.balance{font-size:27px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">ITK <span class="red">LYTE</span></div><button class="header-btn" onclick="openSettings()">⚙ Settings</button></header>
<div class="hero">
<h1 class="hello">Hi Frank</h1>
<div class="small">ITK LYTE Revenue Received</div>
<div class="balance" id="total">GHS 0.00</div>
<div class="stats">
<div class="stat"><span class="small">Businesses</span><b id="bizCount">0</b></div>
<div class="stat"><span class="small">Transactions</span><b id="txCount">0</b></div>
</div>
</div>

<h2>Main Folders</h2>
<div class="grid">
<button class="tile" onclick="openAdmin()"><span class="ico">⚙</span>ADMIN</button>
<button class="tile" onclick="openDepartments()"><span class="ico">▦</span>DEPARTMENTS</button>
</div>

<h2>Businesses & ITK Share</h2>
<div id="businesses"></div>
</div>

<div class="overlay" id="overlay"><div class="sheet">
<button class="close" onclick="closePanel()">×</button>
<div id="panel"></div>
</div></div>

<script>
const KEY='itkLyteV4';
const DEFAULT={
 businesses:[
  {name:'SusuBank',dept:'Zeek Capital',revenue:0,share:10,files:[]},
  {name:'SusuFund',dept:'Zeek Capital',revenue:0,share:10,files:[]},
  {name:'LoanVault',dept:'Zeek Capital',revenue:0,share:10,files:[]},
  {name:'Fast Food',dept:'Zeeda Feeda',revenue:0,share:10,files:[]},
  {name:'Cocoa Farm',dept:'Zeeda Feeda',revenue:0,share:10,files:[]},
  {name:'Boutique',dept:'Zytix Lifestyle',revenue:500,share:10,files:[]},
  {name:'Events & Promotion',dept:'Zytix Lifestyle',revenue:0,share:10,files:[]},
  {name:'Construction',dept:'Zeene Shelters',revenue:0,share:10,files:[]},
  {name:'Real Estate',dept:'Zeene Shelters',revenue:0,share:10,files:[]}
 ],
 transactions:[],
 adminFiles:{}
};
function clone(x){return JSON.parse(JSON.stringify(x))}
let d;
try{d=JSON.parse(localStorage.getItem(KEY))||clone(DEFAULT)}catch(e){d=clone(DEFAULT)}
d.businesses=d.businesses||[];d.transactions=d.transactions||[];d.adminFiles=d.adminFiles||{};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(d));return true}catch(e){alert('Storage is unavailable in this browser/session.');return false}}
function money(n){return 'GHS '+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function totalShare(){return d.businesses.reduce((s,b)=>s+(Number(b.revenue)||0)*(Number(b.share||0)/100),0)}
function render(){
 document.getElementById('total').textContent=money(totalShare());
 document.getElementById('bizCount').textContent=d.businesses.length;
 document.getElementById('txCount').textContent=d.transactions.length;
 document.getElementById('businesses').innerHTML=d.businesses.length?d.businesses.map((b,i)=>`
 <div class="business" onclick="business(${i})">
  <div class="bicon">◆</div><div><div class="bname">${esc(b.name)}</div><div class="bmeta">${esc(b.dept)}</div></div>
  <div class="amount"><b>${money(b.revenue)}</b><div class="share">ITK ${Number(b.share||0)}%: ${money((b.revenue||0)*(b.share||0)/100)}</div></div>
 </div>`).join(''):'<div class="empty">No businesses added yet.</div>';
}
function show(h){document.getElementById('panel').innerHTML=h;document.getElementById('overlay').style.display='flex'}
function closePanel(){document.getElementById('overlay').style.display='none'}
function openAdmin(){
 show(`<button class="back" onclick="closePanel()">← Back</button><h3>Admin</h3>
 <div class="grid">
 ${[['♛','CEO'],['▣','General Manager'],['♙','Human Resource'],['₵','Finance'],['◈','Marketing'],['⌘','Tech']].map(x=>`<button class="tile" onclick="adminFolder('${x[1]}')"><span class="ico">${x[0]}</span>${x[1]}</button>`).join('')}
 </div>`);
}
function adminFolder(n){
 show(`<button class="back" onclick="openAdmin()">← Admin</button><h3>${esc(n)}</h3>
 <div class="grid">
 <button class="tile" onclick="files('${esc(n)}','Documents')"><span class="ico">▤</span>Documents</button>
 <button class="tile" onclick="files('${esc(n)}','Reports')"><span class="ico">▧</span>Reports</button>
 </div>`);
}
function files(owner,type){
 const key=owner+'::'+type; const arr=d.adminFiles[key]||[];
 show(`<button class="back" onclick="adminFolder('${esc(owner)}')">← ${esc(owner)}</button><h3>${esc(type)}</h3>
 <p class="muted">${esc(owner)} → ${esc(type)}</p>
 <label class="upload">＋ Add File<input type="file" hidden onchange="fileAdded('${esc(key)}',this)"></label>
 <div id="filelist">${arr.length?arr.map(f=>`<div class="file"><b>${esc(f.name)}</b><br><small class="muted">${esc(f.size||'')} • saved as record</small></div>`).join(''):'<div class="empty">No file records yet.</div>'}</div>`);
}
function fileAdded(key,input){
 const f=input.files[0];if(!f)return;
 d.adminFiles[key]=d.adminFiles[key]||[];d.adminFiles[key].push({name:f.name,size:(f.size/1024).toFixed(1)+' KB'});
 persist();files(...key.split('::'));render();
}
function openDepartments(){
 show(`<button class="back" onclick="closePanel()">← Back</button><h3>Departments</h3>
 <div class="grid">${['Zeek Capital','Zeeda Feeda','Zytix Lifestyle','Zeene Shelters'].map(x=>`<button class="tile" onclick="dept('${x}')"><span class="ico">▦</span>${x}</button>`).join('')}</div>
 <button class="primary" onclick="addBusiness()">＋ Add Business</button>`);
}
function dept(n){
 let bs=d.businesses.map((b,i)=>[b,i]).filter(x=>x[0].dept===n);
 show(`<button class="back" onclick="openDepartments()">← Departments</button><h3>${esc(n)}</h3>
 ${bs.length?`<div class="grid">${bs.map(([b,i])=>`<button class="tile" onclick="business(${i})"><span class="ico">◆</span>${esc(b.name)}</button>`).join('')}</div>`:'<div class="empty">No businesses in this department.</div>'}
 <button class="primary" onclick="addBusiness('${esc(n)}')">＋ Add Business</button>`);
}
function business(i){
 const b=d.businesses[i], share=(b.revenue||0)*(b.share||0)/100;
 show(`<button class="back" onclick="dept('${esc(b.dept)}')">← ${esc(b.dept)}</button><h3>${esc(b.name)}</h3>
 <div class="item"><b>Business Revenue</b><span class="muted">${money(b.revenue)}</span></div>
 <div class="item"><b>ITK LYTE Share</b><span class="share">${b.share}% = ${money(share)}</span></div>
 <div class="row"><button class="mini" onclick="addTransaction(${i})">＋ Transaction</button><button class="mini" onclick="editBusiness(${i})">✎ Edit</button></div>
 <div class="grid" style="margin:15px 0"><button class="tile" onclick="files('${esc(b.name)}','Documents')"><span class="ico">▤</span>Documents</button><button class="tile" onclick="files('${esc(b.name)}','Reports')"><span class="ico">▧</span>Reports</button></div>
 <h3 style="font-size:17px">Transaction History</h3>${txHTML(i)}`);
}
function txHTML(i){
 const arr=d.transactions.filter(t=>t.business===i).slice().reverse();
 return arr.length?arr.map(t=>`<div class="tx"><div><b>${esc(t.note)}</b><div class="muted">${esc(t.date)}</div></div><strong class="${t.type==='income'?'plus':'minus'}">${t.type==='income'?'+':'-'}${money(t.amount)}</strong></div>`).join(''):'<div class="empty">No transactions recorded.</div>';
}
function addTransaction(i){
 const b=d.businesses[i];
 show(`<button class="back" onclick="business(${i})">← ${esc(b.name)}</button><h3>New Transaction</h3>
 <label>Type</label><select id="tt"><option value="income">Income</option><option value="expense">Expense</option></select>
 <label>Amount</label><input id="ta" type="number" min="0" step="0.01" placeholder="0.00">
 <label>Description</label><input id="tn" placeholder="e.g. Daily sales">
 <button class="primary" onclick="saveTransaction(${i})">Save Transaction</button>`);
}
function saveTransaction(i){
 const a=Number(document.getElementById('ta').value)||0,n=document.getElementById('tn').value.trim()||'Transaction',type=document.getElementById('tt').value;
 if(a<=0)return alert('Enter an amount.');
 d.transactions.push({business:i,type,amount:a,note:n,date:new Date().toLocaleString()});
 d.businesses[i].revenue=Math.max(0,(Number(d.businesses[i].revenue)||0)+(type==='income'?a:-a));
 persist();render();business(i);
}
function editBusiness(i){
 const b=d.businesses[i];
 show(`<button class="back" onclick="business(${i})">← ${esc(b.name)}</button><h3>Edit Business</h3>
 <label>Business Name</label><input id="bn" value="${esc(b.name)}">
 <label>Department</label><select id="bd">${['Zeek Capital','Zeeda Feeda','Zytix Lifestyle','Zeene Shelters'].map(x=>`<option ${x===b.dept?'selected':''}>${x}</option>`).join('')}</select>
 <label>Current Revenue</label><input id="br" type="number" value="${b.revenue}">
 <label>ITK Share %</label><input id="bs" type="number" min="0" max="100" value="${b.share}">
 <button class="primary" onclick="saveBusiness(${i})">Save Changes</button>
 <button class="danger" onclick="deleteBusiness(${i})">Delete Business</button>`);
}
function saveBusiness(i){
 const name=document.getElementById('bn').value.trim();if(!name)return alert('Business name is required.');
 d.businesses[i].name=name;d.businesses[i].dept=document.getElementById('bd').value;d.businesses[i].revenue=Number(document.getElementById('br').value)||0;d.businesses[i].share=Math.min(100,Math.max(0,Number(document.getElementById('bs').value)||0));
 persist();render();business(i);
}
function deleteBusiness(i){
 if(!confirm('Delete this business?'))return;
 d.businesses.splice(i,1);d.transactions=d.transactions.filter(t=>t.business!==i);
 persist();render();openDepartments();
}
function addBusiness(dept='Zeek Capital'){
 show(`<button class="back" onclick="openDepartments()">← Departments</button><h3>Add Business</h3>
 <label>Business Name</label><input id="abn" placeholder="e.g. New Business">
 <label>Department</label><select id="abd">${['Zeek Capital','Zeeda Feeda','Zytix Lifestyle','Zeene Shelters'].map(x=>`<option ${x===dept?'selected':''}>${x}</option>`).join('')}</select>
 <label>Starting Revenue</label><input id="abr" type="number" value="0">
 <label>ITK Share %</label><input id="abs" type="number" value="10" min="0" max="100">
 <button class="primary" onclick="createBusiness()">Create Business</button>`);
}
function createBusiness(){
 const name=document.getElementById('abn').value.trim();if(!name)return alert('Enter a business name.');
 d.businesses.push({name,dept:document.getElementById('abd').value,revenue:Number(document.getElementById('abr').value)||0,share:Math.min(100,Math.max(0,Number(document.getElementById('abs').value)||0)),files:[]});
 persist();render();openDepartments();
}
function openSettings(){
 show(`<button class="back" onclick="closePanel()">← Back</button><h3>Settings</h3>
 <div class="item"><b>Data storage</b><span class="muted">Saved in this browser for this app.</span></div>
 <button class="primary" onclick="exportData()">Export Backup</button>
 <label class="upload">＋ Import Backup<input type="file" accept=".json,application/json" hidden onchange="importData(this)"></label>
 <button class="danger" onclick="resetApp()">Reset App Data</button>`);
}
function exportData(){
 const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='ITK-LYTE-backup.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(input){
 const f=input.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.businesses)throw 0;d=x;persist();render();openSettings();alert('Backup imported.')}catch(e){alert('Invalid ITK LYTE backup.')}};
 r.readAsText(f);
}
function resetApp(){
 if(!confirm('Reset all ITK LYTE data on this browser?'))return;
 d=clone(DEFAULT);persist();render();closePanel();
}
render();
</script>
</body>
</html>
