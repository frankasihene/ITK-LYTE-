<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>ITK LYTE Management</title><style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}.app{max-width:720px;margin:auto;padding-bottom:40px}header{background:#090909;border-bottom:3px solid #e21b2d;padding:18px 20px;position:sticky;top:0;z-index:5}.brand{font-weight:900;letter-spacing:2px;font-size:21px}.red{color:#e21b2d}.hero{margin:18px;background:#111;border:1px solid #333;border-left:6px solid #e21b2d;border-radius:18px;padding:24px}.hello{font-size:25px;margin:0 0 22px}.small{color:#aaa;font-size:13px}.balance{font-size:30px;font-weight:900;margin-top:8px}h2{font-size:20px;margin:25px 18px 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 18px}.tile{min-height:125px;border:1px solid #333;border-radius:16px;background:#141414;color:#fff;padding:18px 10px;font-weight:800;font-size:16px;text-align:center;box-shadow:inset 0 -4px 0 #e21b2d}.tile .ico{font-size:34px;display:block;margin-bottom:13px}.business{margin:0 18px;border:1px solid #292929;border-radius:14px;background:#111;padding:15px;margin-bottom:10px;display:flex;align-items:center;gap:12px}.bicon{width:48px;height:48px;border-radius:12px;background:#e21b2d22;border:1px solid #e21b2d;display:grid;place-items:center}.bname{font-weight:800}.bmeta{font-size:12px;color:#999;margin-top:5px}.amount{margin-left:auto;text-align:right}.share{color:#e21b2d;font-weight:800;font-size:13px}.overlay{position:fixed;inset:0;background:#000b;display:none;z-index:20;align-items:flex-end}.sheet{width:100%;max-width:720px;margin:auto;max-height:88vh;overflow:auto;background:#121212;border-top:3px solid #e21b2d;border-radius:22px 22px 0 0;padding:20px}.close{float:right;border:0;border-radius:50%;background:#292929;color:#fff;width:35px;height:35px;font-size:20px}.sheet h3{font-size:22px}.muted{color:#999;font-size:13px}.back{background:#292929;color:#fff;border:0;border-radius:9px;padding:9px 13px;margin-bottom:12px}.primary{width:100%;padding:12px;background:#e21b2d;color:#fff;border:0;border-radius:10px;font-weight:800}input,select{width:100%;padding:12px;background:#0b0b0b;color:#fff;border:1px solid #444;border-radius:9px;margin:5px 0 10px}.upload{display:inline-block;background:#e21b2d;color:#fff;padding:9px 12px;border-radius:8px;font-weight:800;font-size:12px;margin-top:7px}.file{border-top:1px solid #333;padding:11px 0}.item{background:#191919;border:1px solid #292929;border-radius:12px;padding:15px;margin:9px 0}.item b{display:block;margin-bottom:5px}
</style></head><body><div class="app"><header><div class="brand">ITK <span class="red">LYTE</span></div></header><div class="hero"><h1 class="hello">Hi Frank</h1><div class="small">ITK LYTE Revenue Received</div><div class="balance" id="total">GHS 0.00</div></div><h2>Main Folders</h2><div class="grid"><button class="tile" onclick="openAdmin()"><span class="ico">⚙</span>ADMIN</button><button class="tile" onclick="openDepartments()"><span class="ico">▦</span>DEPARTMENTS</button></div><h2>Businesses & ITK Share</h2><div id="businesses"></div></div><div class="overlay" id="overlay"><div class="sheet"><button class="close" onclick="closePanel()">×</button><div id="panel"></div></div></div><script>
const KEY='itkLyteV3';let d=JSON.parse(localStorage.getItem(KEY)||'{"businesses":[]}');if(!d.businesses.length)d.businesses=[{name:'SusuBank',dept:'Zeek Capital',revenue:0},{name:'SusuFund',dept:'Zeek Capital',revenue:0},{name:'LoanVault',dept:'Zeek Capital',revenue:0},{name:'Fast Food',dept:'Zeeda Feeda',revenue:0},{name:'Cocoa Farm',dept:'Zeeda Feeda',revenue:0},{name:'Boutique',dept:'Zytix Lifestyle',revenue:500},{name:'Events & Promotion',dept:'Zytix Lifestyle',revenue:0},{name:'Construction',dept:'Zeene Shelters',revenue:0},{name:'Real Estate',dept:'Zeene Shelters',revenue:0}];
function save(){localStorage.setItem(KEY,JSON.stringify(d));render()}function money(n){return'GHS '+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}function render(){let t=d.businesses.reduce((s,b)=>s+b.revenue*.1,0);document.getElementById('total').textContent=money(t);document.getElementById('businesses').innerHTML=d.businesses.map((b,i)=>`<div class="business" onclick="business(${i})"><div class="bicon">◆</div><div><div class="bname">${b.name}</div><div class="bmeta">${b.dept}</div></div><div class="amount"><b>${money(b.revenue)}</b><div class="share">ITK: ${money(b.revenue*.1)}</div></div></div>`).join('')}function show(h){panel.innerHTML=h;overlay.style.display='flex'}function closePanel(){overlay.style.display='none'}
function openAdmin(){show(`<button class="back" onclick="closePanel()">← Back</button><h3>Admin</h3><div class="grid">${['CEO','General Manager','Human Resource','Finance'].map((x,i)=>`<button class="tile" onclick="adminFolder('${x}')"><span class="ico">${['♛','▣','♙','₵'][i]}</span>${x}</button>`).join('')}</div>`)}function adminFolder(n){show(`<button class="back" onclick="openAdmin()">← Admin</button><h3>${n}</h3><div class="grid"><button class="tile" onclick="files('${n}','Documents')"><span class="ico">▤</span>Documents</button><button class="tile" onclick="files('${n}','Reports')"><span class="ico">▧</span>Reports</button></div>`)}function files(o,t){show(`<button class="back" onclick="adminFolder('${o}')">← ${o}</button><h3>${t}</h3><p class="muted">${o} → ${t}</p><label class="upload">＋ Upload<input type="file" hidden onchange="fileAdded('${o}','${t}',this)"></label><div id="filelist"></div>`)}function fileAdded(o,t,i){let f=i.files[0];if(f)document.getElementById('filelist').innerHTML=`<div class="file"><b>${f.name}</b><br><small>${o} → ${t} • selected</small></div>`}
function openDepartments(){show(`<button class="back" onclick="closePanel()">← Back</button><h3>Departments</h3><div class="grid">${['Zeek Capital','Zeeda Feeda','Zytix Lifestyle','Zeene Shelters'].map(x=>`<button class="tile" onclick="dept('${x}')"><span class="ico">▦</span>${x}</button>`).join('')}</div>`)}function dept(n){let bs=d.businesses.map((b,i)=>[b,i]).filter(x=>x[0].dept===n);show(`<button class="back" onclick="openDepartments()">← Departments</button><h3>${n}</h3><div class="grid">${bs.map(([b,i])=>`<button class="tile" onclick="business(${i})"><span class="ico">◆</span>${b.name}</button>`).join('')}</div>`)}
function business(i){let b=d.businesses[i];show(`<button class="back" onclick="dept('${b.dept}')">← ${b.dept}</button><h3>${b.name}</h3><div class="item"><b>Business Revenue</b><span class="muted">${money(b.revenue)}</span></div><div class="item"><b>ITK LYTE 10% Share</b><span class="share">${money(b.revenue*.1)}</span></div><button class="primary" onclick="editBusiness(${i})">Edit Transaction / Revenue</button><div class="grid" style="margin:15px 0"><button class="tile" onclick="files('${b.name}','Documents')"><span class="ico">▤</span>Documents</button><button class="tile" onclick="files('${b.name}','Reports')"><span class="ico">▧</span>Reports</button></div>`)}function editBusiness(i){let b=d.businesses[i];show(`<button class="back" onclick="business(${i})">← ${b.name}</button><h3>Edit Transaction</h3><input id="rev" type="number" value="${b.revenue}"><button class="primary" onclick="d.businesses[${i}].revenue=Number(rev.value)||0;save();business(${i})">Save Revenue</button>`)}render();
</script></body></html>
