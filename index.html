<div id="confirmModal" class="fixed inset-0 z-[70] hidden"><div class="absolute inset-0 bg-black/80" onclick="closeConfirm()"></div><div class="absolute bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-[#121212] border-t rounded-t-[28px] p-6"><div class="font-bold text-[18px] text-center" id="confirmTitle"></div><div class="font-mono text-[11px] text-zinc-400 text-center mt-2" id="confirmMsg"></div><div id="confirmInputWrap" class="hidden mt-4"><input id="confirmInput" placeholder="DELETE" class="w-full bg-[#080808] border rounded-xl px-4 py-3 text-[13px]"/></div><div class="grid grid-cols-2 gap-3 mt-6"><button onclick="closeConfirm()" class="bg-[#1A1A1A] border rounded-2xl py-4 font-bold text-[12px]">CANCEL</button><button onclick="proceedConfirm()" class="bg-[#FF0A0A] rounded-2xl py-4 font-bold text-[12px]" id="confirmBtn">YES</button></div><div class="font-mono text-[7px] text-zinc-600 text-center mt-3" id="confirmStep"></div></div></div>
<div id="bizSheet" class="fixed inset-0 z-50 hidden"><div class="absolute inset-0 bg-black/80" onclick="closeBizSheet()"></div><div class="absolute bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-[#121212] border-t rounded-t-[28px] p-6"><div class="flex justify-between"><div class="font-bold tracking-widest" id="bizSheetTitle">BUSINESS</div><button onclick="requestDeleteBiz()" id="bizDeleteBtn" class="text-red-400 border border-red-500/30 bg-red-500/10 px-3 py-1 rounded-full text-[10px]">DELETE</button></div><input id="b-name" placeholder="Business Name - e.g. Apartment" class="mt-4 w-full bg-[#080808] border rounded-xl px-4 py-3 text-[13px]"/><select id="b-dept" class="mt-3 w-full bg-[#080808] border rounded-xl px-4 py-3 text-[13px]"><option value="zeek">ZEEK CAPITAL</option><option value="zeeda">ZEEDA FEEDA</option><option value="zytix">ZYTIX LIFESTYLE</option><option value="zeene">ZEENE SHELTERS</option></select><button onclick="saveBiz()" class="mt-4 w-full bg-white text-black rounded-2xl py-4 font-bold">SAVE</button></div></div>
<div id="staffSheet" class="fixed inset-0 z-50 hidden"><div class="absolute inset-0 bg-black/80" onclick="closeStaff()"></div><div class="absolute bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-[#121212] border-t rounded-t-[28px] p-6"><input id="s-name" placeholder="Name" class="w-full bg-[#080808] border rounded-xl px-4 py-3"/><input id="s-pos" placeholder="Position" class="w-full bg-[#080808] border rounded-xl px-4 py-3 mt-3"/><select id="s-dept" onchange="updateBiz()" class="w-full bg-[#080808] border rounded-xl px-4 py-3 mt-3"><option value="zeek">ZEEK</option><option value="zeeda">ZEEDA</option><option value="zytix">ZYTIX</option><option value="zeene">ZEENE</option><option value="central">CENTRAL</option></select><select id="s-biz" class="w-full bg-[#080808] border rounded-xl px-4 py-3 mt-3"></select><input id="s-salary" type="number" placeholder="Salary" class="w-full bg-[#080808] border rounded-xl px-4 py-3 mt-3"/><button onclick="saveStaff()" class="mt-4 w-full bg-[#FF3D0F] rounded-2xl py-4 font-bold">SAVE STAFF</button></div></div>
<div id="txSheet" class="fixed inset-0 z-50 hidden"><div class="absolute inset-0 bg-black/80" onclick="closeTx()"></div><div class="absolute bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-[#121212] border-t rounded-t-[28px] p-6"><input id="txAmt" type="number" placeholder="Amount GHS" class="w-full bg-[#080808] border rounded-2xl px-4 py-4 text-[20px] font-bold"/><select id="txDept" onchange="updateBiz()" class="w-full bg-[#080808] border rounded-xl px-4 py-3 mt-3"><option value="zeek">ZEEK</option><option value="zeeda">ZEEDA</option><option value="zytix">ZYTIX</option><option value="zeene">ZEENE</option></select><select id="txBiz" class="w-full bg-[#080808] border rounded-xl px-4 py-3 mt-3"></select><input id="txNote" placeholder="Note" class="w-full bg-[#080808] border rounded-xl px-4 py-3 mt-3"/><button onclick="saveTx()" class="mt-4 w-full bg-[#FF3D0F] rounded-2xl py-4 font-bold">CONFIRM</button></div></div>
<div id="txDetailSheet" class="fixed inset-0 z-50 hidden"><div class="absolute inset-0 bg-black/80" onclick="closeTxDetail()"></div><div class="absolute bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-[#121212] border-t rounded-t-[28px] p-6"><div id="dtNote" class="font-bold"></div><div id="dtAmt" class="text-[30px] font-black mt-2"></div><button onclick="requestDeleteTx()" class="mt-5 w-full bg-red-500/10 border border-red-500/30 text-red-400 rounded-2xl py-4 font-bold text-[11px]">DELETE TRANSACTION</button></div></div>

<script>
let DEFAULT_BIZ={zeek:['Trading Desk','Investment Fund'],zeeda:['Farm','Restaurant','Supply'],zytix:['Boutique','Events & Rave','Media'],zeene:['Apartment','Hotel'],central:['Head Office']};
const DEPT_FULL={zeek:'ZEEK CAPITAL',zeeda:'ZEEDA FEEDA',zytix:'ZYTIX LIFESTYLE',zeene:'ZEENE SHELTERS',central:'CENTRAL'};
const DEFAULT={role:'admin',curDept:'zeene',curTxId:null,curStaffId:1,biz:JSON.parse(JSON.stringify(DEFAULT_BIZ)),bizDetails:{},staff:[{id:1,name:'Frank Asihene',position:'CEO',dept:'central',business:'Head Office',salary:0}],tx:[],depts:{zeek:{bal:0},zeeda:{bal:0},zytix:{bal:0},zeene:{bal:0},central:{bal:0}}};
let DB;try{DB=JSON.parse(localStorage.getItem('itk_v93_FINAL')||'null');if(!DB||!DB.depts)throw 0}catch(e){DB=JSON.parse(JSON.stringify(DEFAULT));localStorage.setItem('itk_v93_FINAL',JSON.stringify(DB));['itk_v92_FINAL_ZERO','itk_v91_NOCASH_ZERO','itk_v90_ZERO','itk_v86'].forEach(k=>localStorage.removeItem(k));}
let editId=null,curType='income',curStaffTab='central',confirmAction=null,confirmStep=1,editBizOriginal=null;

function resetZero(){showDoubleConfirm('RESET TO ZERO?','Wipe all to GHS 0?',()=>{DB=JSON.parse(JSON.stringify(DEFAULT));save();renderAll();alert('Zeroed');},true);}
function showDoubleConfirm(t,m,a,req=false){confirmAction=a;confirmStep=1;document.getElementById('confirmTitle').innerText=t;document.getElementById('confirmMsg').innerText=m;document.getElementById('confirmStep').innerText='STEP 1 of 2';document.getElementById('confirmBtn').innerText='YES, CONTINUE';document.getElementById('confirmInputWrap').classList.add('hidden');document.getElementById('confirmInput').value='';document.getElementById('confirmModal').classList.remove('hidden');document.getElementById('confirmModal').dataset.requireType=req?'1':'0';}
function closeConfirm(){document.getElementById('confirmModal').classList.add('hidden');}
function proceedConfirm(){const req=document.getElementById('confirmModal').dataset.requireType==='1';if(confirmStep===1){if(req){document.getElementById('confirmStep').innerText='STEP 2 • Type DELETE';document.getElementById('confirmTitle').innerText='FINAL';document.getElementById('confirmMsg').innerText='Type DELETE';document.getElementById('confirmInputWrap').classList.remove('hidden');document.getElementById('confirmBtn').innerText='PERMANENTLY DELETE';confirmStep=2;return;}else{confirmStep=2;document.getElementById('confirmBtn').innerText='YES, DELETE';}}if(confirmStep===2){if(req&&document.getElementById('confirmInput').value!=='DELETE'){alert('Type DELETE');return;}if(confirmAction)confirmAction();closeConfirm();}}
function requestDeleteBiz(){if(!editBizOriginal)return;showDoubleConfirm('DELETE BUSINESS? '+editBizOriginal,'Delete "'+editBizOriginal+'"?',()=>{DB.biz[DB.curDept]=DB.biz[DB.curDept].filter(b=>b!==editBizOriginal);DB.staff.forEach(s=>{if(s.business===editBizOriginal){s.business='Head Office';s.dept='central';}});save();closeBizSheet();renderAll();},true);}
function requestDeleteTx(){showDoubleConfirm('DELETE TRANSACTION?','Delete? Balance reversed.',()=>{const i=DB.tx.findIndex(x=>x.id===DB.curTxId);if(i>-1){const t=DB.tx[i];if(t.type==='income')DB.depts[t.dept].bal-=t.amt;else DB.depts[t.dept].bal+=t.amt;DB.tx.splice(i,1);save();closeTxDetail();renderAll();}},false);}
function save(){localStorage.setItem('itk_v93_FINAL',JSON.stringify(DB));}
function fmt(n){return 'GHS '+Number(n||0).toLocaleString();}
function goPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('p-'+p).classList.add('active');document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('on'));document.querySelector(`[data-p="${p}"]`).classList.add('on');if(p==='departments')renderDeptPage();if(p==='audit')renderAudit();if(p==='team')renderTeam();}

// NO CAPS - KEEP ORIGINAL CASE
function renderDeptPage(){
  const d=DB.curDept||'zeene';const bal=DB.depts[d]?.bal||0;
  document.getElementById('deptActiveCard').innerHTML=`<div class="flex justify-between"><div><div class="font-bold text-[16px] tracking-widest">${DEPT_FULL[d]}</div><div class="font-mono text-[10px] text-zinc-500">${(DB.biz[d]||[]).length} businesses • ${fmt(bal)}</div></div><div class="text-right"><div class="font-bold text-[15px]">${fmt(bal)}</div><div class="font-mono text-[8px] text-zinc-500">BALANCE</div></div></div>`;
  // HERE IS THE FIX - NO toUpperCase() anymore
  document.getElementById('deptBusinessList').innerHTML=(DB.biz[d]||[]).map(b=>`<div onclick="openBizSheet('${b.replace(/'/g,"\\'")}')" class="cursor-pointer bg-[#121212] border border-[#262626] rounded-3xl p-5 flex justify-between items-center"><div><div class="font-bold text-[15px] tracking-tight">${b}</div><div class="font-mono text-[9px] text-zinc-500 mt-1">Tap to edit / delete</div></div><div class="font-mono text-[10px] bg-[#080808] border border-[#262626] px-3 py-1 rounded-full">EDIT →</div></div>`).join('')||'<div class="text-center text-zinc-600 p-6">No businesses</div>';
}

// RESTORED AUDIT WITH MONTH/YEAR FILTERS
function renderAudit(){
  const monthVal=document.getElementById('auditMonth').value;
  const yearVal=document.getElementById('auditYear').value;
  const deptVal=document.getElementById('auditDept').value;
  const search=(document.getElementById('auditSearch')?.value||'').toLowerCase();
  let filtered=DB.tx.filter(t=>{
    const dt=new Date(t.ts);
    if(monthVal!=='all'&&dt.getMonth()!=parseInt(monthVal))return false;
    if(yearVal!=='all'&&dt.getFullYear()!=parseInt(yearVal))return false;
    if(deptVal!=='all'&&t.dept!==deptVal)return false;
    if(search&&!((t.note||'').toLowerCase().includes(search)||(t.business||'').toLowerCase().includes(search)))return false;
    return true;
  });
  const income=filtered.filter(t=>t.type==='income').reduce((a,b)=>a+b.amt,0);
  const expense=filtered.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amt,0);
  document.getElementById('auditIncome').innerText=fmt(income);
  document.getElementById('auditExpense').innerText=fmt(expense);
  document.getElementById('auditNet').innerText=fmt(income-expense);
  document.getElementById('auditCount').innerText=filtered.length+' transactions • '+(monthVal==='all'?'All months':document.getElementById('auditMonth').options[document.getElementById('auditMonth').selectedIndex].text)+' • Net '+fmt(income-expense);
  document.getElementById('auditList').innerHTML=filtered.map(t=>`<div onclick="openTxDetail(${t.id})" class="cursor-pointer bg-[#121212] border border-[#262626] rounded-2xl p-3 flex justify-between"><div><div class="font-bold text-[12px]">${t.note}</div><div class="font-mono text-[8px] text-zinc-500 mt-1">${t.dept.toUpperCase()} • ${t.business} • ${new Date(t.ts).toLocaleDateString()}</div></div><div class="font-bold text-[12px] ${t.type==='income'?'text-emerald-400':'text-red-400'}">${t.type==='income'?'+':'-'}${t.amt}</div></div>`).join('')||'<div class="text-center text-zinc-600 p-6 font-mono text-[11px]">No transactions for this filter • ZERO</div>';
}

function updateBiz(){const ds=document.getElementById('s-dept')?.value||'zeene';document.getElementById('s-biz').innerHTML=(DB.biz[ds]||[]).map(b=>`<option>${b}</option>`).join('');const dt=document.getElementById('txDept')?.value||'zeene';document.getElementById('txBiz').innerHTML=(DB.biz[dt]||[]).map(b=>`<option>${b}</option>`).join('');}
function openBizSheet(b=null){editBizOriginal=b;document.getElementById('bizSheetTitle').innerText=b?'Edit: '+b:'Add Business';document.getElementById('b-name').value=b||'';document.getElementById('b-dept').value=DB.curDept;document.getElementById('bizSheet').classList.remove('hidden');}
function closeBizSheet(){document.getElementById('bizSheet').classList.add('hidden');editBizOriginal=null;}
function saveBiz(){const nn=document.getElementById('b-name').value.trim();const dept=document.getElementById('b-dept').value;if(!nn)return alert('Enter name');if(editBizOriginal&&editBizOriginal!==nn){DB.biz[DB.curDept]=DB.biz[DB.curDept].filter(x=>x!==editBizOriginal);}if(!DB.biz[dept].includes(nn))DB.biz[dept].push(nn);save();closeBizSheet();renderAll();}
function openStaff(){document.getElementById('staffSheet').classList.remove('hidden');}
function closeStaff(){document.getElementById('staffSheet').classList.add('hidden');}
function saveStaff(){const name=document.getElementById('s-name').value.trim();if(!name)return;DB.staff.push({id:Date.now(),name,position:document.getElementById('s-pos').value,dept:document.getElementById('s-dept').value,business:document.getElementById('s-biz').value,salary:parseFloat(document.getElementById('s-salary').value)||0});save();closeStaff();renderAll();}
function openTx(t){curType=t;updateBiz();document.getElementById('txSheet').classList.remove('hidden');}
function closeTx(){document.getElementById('txSheet').classList.add('hidden');}
function saveTx(){const amt=parseFloat(document.getElementById('txAmt').value)||0;if(!amt)return;const dept=document.getElementById('txDept').value,biz=document.getElementById('txBiz').value,note=document.getElementById('txNote').value||curType;DB.tx.unshift({id:Date.now(),dept,business:biz,amt,note,type:curType,by:'Frank Asihene',ts:Date.now()});if(curType==='income')DB.depts[dept].bal+=amt;else DB.depts[dept].bal-=amt;save();closeTx();renderAll();}
function openTxDetail(id){DB.curTxId=id;const t=DB.tx.find(x=>x.id===id);document.getElementById('dtNote').innerText=t.note;document.getElementById('dtAmt').innerText=fmt(t.amt);document.getElementById('txDetailSheet').classList.remove('hidden');}
function closeTxDetail(){document.getElementById('txDetailSheet').classList.add('hidden');}
function switchDeptTab(d,el){DB.curDept=d;document.querySelectorAll('.dept-tab').forEach(b=>{b.className='dept-tab shrink-0 px-4 py-2.5 rounded-full text-[11px] font-bold bg-[#1A1A1A] border border-[#262626] text-zinc-400';});el.className='dept-tab on shrink-0 px-4 py-2.5 rounded-full text-[11px] font-bold border bg-white text-black';renderDeptPage();save();}
function switchStaffTab(d,el){curStaffTab=d;renderTeam();}
function renderTeam(){document.getElementById('teamCategorized').innerHTML=DB.staff.map(s=>`<div class="bg-[#121212] border rounded-2xl p-4"><div class="font-bold">${s.name}</div><div class="font-mono text-[9px] text-zinc-500">${s.business} • GHS ${s.salary}</div></div>`).join('');}
function renderAll(){const cash=Object.values(DB.depts).reduce((a,b)=>a+(b.bal||0),0),payroll=DB.staff.reduce((s,x)=>s+(x.salary||0),0);document.getElementById('netPos').innerText=fmt(cash);document.getElementById('payrollSum').innerText='Payroll: '+fmt(payroll)+' • '+DB.staff.length+' staff • NO CASH MODE';document.getElementById('finGrid').innerHTML=`<div class="bg-[#080808] border rounded-xl p-3"><div class="font-mono text-[8px] text-zinc-500">PAYROLL</div><div class="font-bold text-[12px]">${payroll.toLocaleString()}</div></div><div class="bg-[#080808] border rounded-xl p-3"><div class="font-mono text-[8px] text-zinc-500">DEPTS</div><div class="font-bold text-[12px]">4 ACTIVE</div></div>`;document.getElementById('txList').innerHTML=DB.tx.slice(0,20).map(t=>`<div class="flex justify-between bg-[#080808] border rounded-xl p-3"><div><div class="font-bold text-[12px]">${t.note}</div><div class="font-mono text-[9px] text-zinc-500">${t.dept.toUpperCase()} • ${t.business}</div></div><div class="font-bold text-[12px] ${t.type==='income'?'text-emerald-400':'text-red-400'}">${t.type==='income'?'+':'-'}${t.amt}</div></div>`).join('')||'<div class="text-center text-zinc-600 p-6 text-[11px]">No transactions • ZERO</div>';renderDeptPage();renderAudit();renderTeam();}
function openProfile(){}
updateBiz();renderAll();goPage('departments');
</script>
</body>
