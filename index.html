<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>ITK LYTE V11 SIMPLE LOGIN</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#080808;color:#eee;font-family:sans-serif}.page{display:none}.page.active{display:block}.navbtn{opacity:.45}.navbtn.on{opacity:1}.hide::-webkit-scrollbar{display:none}</style>
</head>
<body class="max-w-[430px] mx-auto min-h-screen pb-28 bg-[#080808]">

<div id="loginPage" class="fixed inset-0 z-[100] bg-[#080808] flex items-center justify-center px-6 max-w-[430px] mx-auto">
<div class="w-full bg-[#121212] border border-[#262626] rounded-3xl p-6">
<div class="font-bold text-center">ITK LYTE</div><div class="text-[10px] text-zinc-500 text-center mb-6 font-mono">V11 • admin / staff • password</div>
<div class="text-[9px] text-zinc-500 font-mono mb-2">ROLE</div>
<select id="loginRole" class="w-full bg-[#080808] border border-[#262626] rounded-xl px-4 py-3.5 text-[13px] font-bold">
<option value="">-- choose --</option>
<option value="admin">admin</option>
<option value="staff">staff</option>
</select>
<div class="text-[9px] text-zinc-500 font-mono mt-4 mb-2">PASSWORD</div>
<input id="loginPass" type="text" value="password" class="w-full bg-[#080808] border border-[#262626] rounded-xl px-4 py-3.5 text-[13px]"/>
<div id="loginError" class="hidden mt-3 text-[10px] text-red-400 bg-red-500/10 border border-red-500/20 rounded-xl p-3 font-mono"></div>
<button onclick="doLogin()" class="mt-5 w-full bg-white text-black rounded-2xl py-4 font-bold">LOGIN</button>
<button onclick="localStorage.clear();location.reload()" class="mt-3 w-full bg-[#1A1A1A] border rounded-xl py-2 text-[9px] font-mono">RESET CACHE IF STUCK</button>
</div>
</div>

<div id="appContent" class="hidden">
<header class="sticky top-0 z-30 bg-[#080808] border-b border-[#262626] px-5 py-4 flex justify-between"><div class="font-bold" id="roleLabel"></div><button onclick="doLogout()" class="text-[9px] bg-[#1A1A1A] border rounded-full px-3 py-1">LOGOUT</button></header>

<div id="p-home" class="page active px-5 pt-5"><div class="font-bold">HOME</div><div class="mt-4 bg-[#121212] border rounded-3xl p-5"><div class="text-[10px] text-zinc-500 font-mono">NET</div><div class="text-[28px] font-bold" id="netPos">GHS 0</div><div class="text-[9px] text-zinc-500 mt-2 font-mono" id="payrollSum"></div></div><div class="mt-4 bg-[#121212] border rounded-3xl p-4"><div id="txList" class="space-y-2"></div></div></div>

<div id="p-departments" class="page px-5 pt-5"><div class="flex justify-between"><div class="font-bold">DEPARTMENTS</div><button onclick="openBizSheet()" class="bg-white text-black px-3 py-1 rounded-full text-[10px] font-bold">+ BUSINESS</button></div><div class="mt-4 flex gap-2 overflow-x-auto hide"><button onclick="switchDeptTab('zeek',this)" class="dept-tab on bg-white text-black px-4 py-2 rounded-full text-[11px] font-bold">ZEEK</button><button onclick="switchDeptTab('zeeda',this)" class="dept-tab bg-[#1A1A1A] border px-4 py-2 rounded-full text-[11px]">ZEEDA</button><button onclick="switchDeptTab('zytix',this)" class="dept-tab bg-[#1A1A1A] border px-4 py-2 rounded-full text-[11px]">ZYTIX</button><button onclick="switchDeptTab('zeene',this)" class="dept-tab bg-[#1A1A1A] border px-4 py-2 rounded-full text-[11px]">ZEENE</button><button onclick="switchDeptTab('central',this)" class="dept-tab bg-[#1A1A1A] border px-4 py-2 rounded-full text-[11px]">ADMIN</button></div><div id="deptActiveCard" class="mt-4 bg-[#121212] border rounded-3xl p-4"></div><div id="deptBusinessList" class="mt-4 space-y-2"></div></div>

<div id="p-team" class="page px-5 pt-5"><div class="flex justify-between"><div class="font-bold">STAFF & SALARIES</div><button onclick="openStaffForm()" class="bg-white text-black px-3 py-1 rounded-full text-[10px] font-bold">+ ADD</button></div><div class="grid grid-cols-3 gap-2 mt-4"><div class="bg-[#121212] border rounded-2xl p-3"><div class="text-[7px] text-zinc-500 font-mono">STAFF</div><div class="font-bold" id="totalStaff">0</div></div><div class="bg-[#121212] border rounded-2xl p-3"><div class="text-[7px] text-zinc-500 font-mono">GROSS</div><div class="font-bold text-[10px]" id="totalPayroll">GHS 0</div></div><div class="bg-[#0F3D6E] rounded-2xl p-3"><div class="text-[7px] text-white/70 font-mono">TIER2 5%</div><div class="font-bold text-[10px] text-white" id="totalTier2">GHS 0</div></div></div><div class="mt-2 grid grid-cols-3 gap-2 bg-[#121212] border rounded-3xl p-3"><div class="bg-[#080808] border rounded-xl p-2"><div class="text-[6px] text-zinc-500 font-mono">T1 18.5%</div><div class="font-bold text-[9px]" id="totalSSNIT1">GHS 0</div></div><div class="bg-[#080808] border rounded-xl p-2"><div class="text-[6px] text-zinc-500 font-mono">PAYE TAX</div><div class="font-bold text-[9px] text-red-300" id="totalPAYE">GHS 0</div></div><div class="bg-[#080808] border rounded-xl p-2"><div class="text-[6px] text-zinc-500 font-mono">NET</div><div class="font-bold text-[9px] text-emerald-400" id="totalNetPay">GHS 0</div></div></div><input id="staffSearch" oninput="renderTeam()" placeholder="Search name dept business phone" class="mt-3 w-full bg-[#121212] border rounded-full px-4 py-3 text-[11px] font-mono"/><div class="mt-3 flex gap-2 overflow-x-auto hide"><button onclick="switchStaffTab('central',this)" class="staff-tab on bg-white text-black px-4 py-2 rounded-full text-[11px] font-bold">ADMIN</button><button onclick="switchStaffTab('zeek',this)" class="staff-tab bg-[#1A1A1A] border px-4 py-2 rounded-full text-[11px]">ZEEK</button><button onclick="switchStaffTab('zeeda',this)" class="staff-tab bg-[#1A1A1A] border px-4 py-2 rounded-full text-[11px]">ZEEDA</button><button onclick="switchStaffTab('zytix',this)" class="staff-tab bg-[#1A1A1A] border px-4 py-2 rounded-full text-[11px]">ZYTIX</button><button onclick="switchStaffTab('zeene',this)" class="staff-tab bg-[#1A1A1A] border px-4 py-2 rounded-full text-[11px]">ZEENE</button></div><div id="teamActiveCard" class="mt-3 bg-[#121212] border rounded-3xl p-4"></div><div id="teamCategorized" class="mt-3 space-y-4 pb-10"></div></div>

<div id="p-audit" class="page px-5 pt-5"><div class="flex justify-between"><div class="font-bold">AUDIT</div><button onclick="openTx('income')" class="bg-white text-black px-3 py-1 rounded-full text-[10px] font-bold">+ TXN</button></div><div class="mt-4 flex gap-2"><button onclick="switchAudit('month',this)" class="audit-tab on flex-1 py-2 rounded-full text-[11px] font-bold bg-white text-black">MONTHLY</button><button onclick="switchAudit('year',this)" class="audit-tab flex-1 py-2 rounded-full text-[11px] font-bold bg-[#1A1A1A] border">YEARLY</button></div><div class="mt-3 grid grid-cols-3 gap-2"><select id="auditMonth" onchange="renderAudit()" class="bg-[#121212] border rounded-xl px-2 py-3 text-[10px]"><option value="all">ALL MONTHS</option><option value="0">JAN</option><option value="1">FEB</option><option value="2">MAR</option><option value="3">APR</option><option value="4">MAY</option><option value="5">JUN</option><option value="6">JUL</option><option value="7">AUG</option><option value="8">SEP</option><option value="9">OCT</option><option value="10">NOV</option><option value="11">DEC</option></select><select id="auditYear" onchange="renderAudit()" class="bg-[#121212] border rounded-xl px-2 py-3 text-[10px]"><option value="all">ALL YEARS</option><option value="2026">2026</option><option value="2025">2025</option></select><select id="auditDept" onchange="renderAudit()" class="bg-[#121212] border rounded-xl px-2 py-3 text-[10px]"><option value="all">ALL DEPTS</option><option value="zeek">ZEEK</option><option value="zeeda">ZEEDA</option><option value="zytix">ZYTIX</option><option value="zeene">ZEENE</option><option value="central">ADMIN</option></select></div><div id="auditList" class="mt-3 space-y-2 pb-10"></div></div>

<nav class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-[#0A0A0A] border-t px-6 py-3 flex justify-between z-40"><button onclick="goPage('home')" data-p="home" class="navbtn on flex flex-col items-center"><span class="text-[10px]">HOME</span></button><button onclick="goPage('departments')" data-p="departments" class="navbtn flex flex-col items-center"><span class="text-[10px]">DEPTS</span></button><button onclick="goPage('team')" data-p="team" class="navbtn flex flex-col items-center"><span class="text-[10px]">TEAM</span></button><button onclick="goPage('audit')" data-p="audit" class="navbtn flex flex-col items-center"><span class="text-[10px]">AUDIT</span></button></nav>
</div>

<div id="bizSheet" class="fixed inset-0 z-50 hidden"><div class="absolute inset-0 bg-black/80" onclick="closeBizSheet()"></div><div class="absolute bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-[#121212] border-t rounded-t-[28px] p-6"><input id="b-name" placeholder="Business" class="w-full bg-[#080808] border rounded-xl px-4 py-3"/><select id="b-dept" class="mt-3 w-full bg-[#080808] border rounded-xl px-4 py-3"><option value="zeek">ZEEK</option><option value="zeeda">ZEEDA</option><option value="zytix">ZYTIX</option><option value="zeene">ZEENE</option><option value="central">ADMIN</option></select><button onclick="saveBiz()" class="mt-4 w-full bg-white text-black rounded-2xl py-4 font-bold">SAVE</button></div></div>
<div id="txSheet" class="fixed inset-0 z-50 hidden"><div class="absolute inset-0 bg-black/80" onclick="closeTx()"></div><div class="absolute bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-[#121212] border-t rounded-t-[28px] p-6"><input id="txAmt" type="number" placeholder="Amount GHS" class="w-full bg-[#080808] border rounded-2xl px-4 py-4 text-[20px] font-bold"/><select id="txDept" onchange="updateBiz()" class="w-full bg-[#080808] border rounded-xl px-4 py-3 mt-3"><option value="zeek">ZEEK</option><option value="zeeda">ZEEDA</option><option value="zytix">ZYTIX</option><option value="zeene">ZEENE</option><option value="central">ADMIN</option></select><select id="txBiz" class="w-full bg-[#080808] border rounded-xl px-4 py-3 mt-3"></select><input id="txNote" placeholder="Note" class="w-full bg-[#080808] border rounded-xl px-4 py-3 mt-3"/><textarea id="txReceipt" placeholder="Receipt well" class="w-full bg-[#080808] border rounded-xl px-4 py-3 mt-3 h-20 text-[11px]"></textarea><button onclick="saveTx()" class="mt-4 w-full bg-[#FF3D0F] rounded-2xl py-4 font-bold">SAVE RECEIPT</button></div></div>
<div id="staffSheet" class="fixed inset-0 z-50 hidden"><div class="absolute inset-0 bg-black/80" onclick="closeStaffForm()"></div><div class="absolute bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-[#121212] border-t rounded-t-[28px] p-6"><input id="s-name" placeholder="Full Name" class="w-full bg-[#080808] border rounded-xl px-4 py-3"/><div class="grid grid-cols-2 gap-2 mt-2"><select id="s-dept" class="bg-[#080808] border rounded-xl px-4 py-3 text-[11px]"><option value="central">ADMIN</option><option value="zeek">ZEEK</option><option value="zeeda">ZEEDA</option><option value="zytix">ZYTIX</option><option value="zeene">ZEENE</option></select><input id="s-business" placeholder="Business" class="bg-[#080808] border rounded-xl px-4 py-3 text-[11px]"/></div><div class="grid grid-cols-2 gap-2 mt-2"><input id="s-position" placeholder="Position" class="bg-[#080808] border rounded-xl px-4 py-3 text-[11px]"/><input id="s-phone" placeholder="Phone" class="bg-[#080808] border rounded-xl px-4 py-3 text-[11px]"/></div><input id="s-salary" type="number" placeholder="Salary GHS" class="mt-2 w-full bg-[#080808] border rounded-xl px-4 py-3 text-[11px]"/><button onclick="saveStaffForm()" class="mt-4 w-full bg-white text-black rounded-2xl py-4 font-bold">SAVE STAFF</button></div></div>
<div id="receiptModal" class="fixed inset-0 bg-black/90 hidden z-[70] p-5"><div class="bg-white text-black rounded-3xl p-6 max-w-md mx-auto mt-10"><div id="receiptContent"></div><button onclick="document.getElementById('receiptModal').classList.add('hidden')" class="mt-5 w-full bg-black text-white rounded-full py-3 text-[11px] font-bold">CLOSE</button></div></div>

<script>
let DEFAULT_BIZ={zeek:['Trading Desk','Investment Fund'],zeeda:['Farm','Restaurant'],zytix:['Boutique','Media'],zeene:['Apartment','Hotel'],central:['Head Office','HR','Finance','Admin Office']};
const DEPT_FULL={zeek:'ZEEK',zeeda:'ZEEDA',zytix:'ZYTIX',zeene:'ZEENE',central:'ADMIN'};
const DEFAULT={curDept:'central',curStaffDept:'central',biz:JSON.parse(JSON.stringify(DEFAULT_BIZ)),staff:[{id:1,name:'Frank Asihene',position:'CEO',dept:'central',business:'Head Office',phone:'0244000001',salary:15000},{id:2,name:'Kwame Mensah',position:'General Manager',dept:'central',business:'Admin Office',phone:'0244000010',salary:8000},{id:3,name:'Ama Serwaa',position:'HR Manager',dept:'central',business:'HR',phone:'0244000011',salary:6500},{id:4,name:'Kofi Boateng',position:'Finance Manager',dept:'central',business:'Finance',phone:'0244000012',salary:7000}],tx:[],depts:{zeek:{bal:0},zeeda:{bal:0},zytix:{bal:0},zeene:{bal:0},central:{bal:0}}};
let DB=JSON.parse(JSON.stringify(DEFAULT));try{let s=localStorage.getItem('itk_v11_SIMPLE');if(s)DB=JSON.parse(s);}catch(e){}
let curStaffTab=DB.curStaffDept||'central',curAudit='month',editingStaff=null,curType='income',editBizOriginal=null;
function ghanaPAYE(t){let tax=0,b=[0,490,600,730,3896.67,19896.67,50496.67],r=[0,0.05,0.10,0.175,0.25,0.30,0.35];for(let i=0;i<b.length;i++){let up=b[i+1]||Infinity,low=b[i];if(t>low){let a=Math.min(t,up)-low;if(a>0)tax+=a*r[i];}}return Math.round(tax);}
function ghanaDeductions(s){let emp=s*0.055,t2=s*0.05,te=s*0.135,taxable=s-emp,paye=ghanaPAYE(taxable),net=s-emp-paye;return{totalT1:emp+te,paye,net,tier2:t2};}
function fmt(n){return 'GHS '+Number(n||0).toLocaleString();}
function save(){localStorage.setItem('itk_v11_SIMPLE',JSON.stringify(DB));}
function doLogin(){
 let role=document.getElementById('loginRole').value.trim().toLowerCase();
 let pass=document.getElementById('loginPass').value.trim().toLowerCase();
 let err=document.getElementById('loginError');
 if(!role){err.innerText='Select admin or staff';err.classList.remove('hidden');return;}
 if(pass!=='password'){err.innerText='Password is password';err.classList.remove('hidden');return;}
 localStorage.setItem('itk_logged_in','1');localStorage.setItem('itk_role',role);
 document.getElementById('loginPage').classList.add('hidden');document.getElementById('appContent').classList.remove('hidden');
 document.getElementById('roleLabel').innerText=role;renderAll();
}
function doLogout(){localStorage.removeItem('itk_logged_in');localStorage.removeItem('itk_role');location.reload();}
(function(){if(localStorage.getItem('itk_logged_in')==='1'){document.getElementById('loginPage').classList.add('hidden');document.getElementById('appContent').classList.remove('hidden');document.getElementById('loginRole').value=localStorage.getItem('itk_role');document.getElementById('roleLabel').innerText=localStorage.getItem('itk_role');}})();
function goPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('p-'+p).classList.add('active');document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('on'));document.querySelector(`[data-p="${p}"]`).classList.add('on');if(p==='team')renderTeam();if(p==='departments')renderDeptPage();if(p==='audit')renderAudit();}
function renderDeptPage(){let d=DB.curDept||'central';document.getElementById('deptActiveCard').innerHTML=`<div class="flex justify-between"><div><div class="font-bold">${DEPT_FULL[d]}</div><div class="text-[9px] text-zinc-500">${(DB.biz[d]||[]).length} businesses</div></div><div class="font-bold">${fmt(DB.depts[d]?.bal||0)}</div></div>`;document.getElementById('deptBusinessList').innerHTML=(DB.biz[d]||[]).map(b=>`<div onclick="openBizSheet('${b}')" class="bg-[#121212] border rounded-2xl p-4 flex justify-between"><div class="font-bold text-[13px]">${b}</div><div class="text-[9px] bg-[#080808] border px-3 py-1 rounded-full">EDIT</div></div>`).join('');}
function switchDeptTab(d,el){DB.curDept=d;document.querySelectorAll('.dept-tab').forEach(b=>{b.className='dept-tab bg-[#1A1A1A] border px-4 py-2 rounded-full text-[11px]';});el.className='dept-tab on bg-white text-black px-4 py-2 rounded-full text-[11px] font-bold';renderDeptPage();save();}
function updateBiz(){document.getElementById('txBiz').innerHTML=(DB.biz[document.getElementById('txDept').value]||[]).map(b=>`<option>${b}</option>`).join('');}
function openBizSheet(b=null){editBizOriginal=b;document.getElementById('b-name').value=b||'';document.getElementById('b-dept').value=DB.curDept;document.getElementById('bizSheet').classList.remove('hidden');}
function closeBizSheet(){document.getElementById('bizSheet').classList.add('hidden');}
function saveBiz(){let nn=document.getElementById('b-name').value.trim();let dept=document.getElementById('b-dept').value;if(!nn)return;if(editBizOriginal)DB.biz[DB.curDept]=DB.biz[DB.curDept].filter(x=>x!==editBizOriginal);if(!DB.biz[dept].includes(nn))DB.biz[dept].push(nn);save();closeBizSheet();renderAll();}
function openTx(t){curType=t;updateBiz();document.getElementById('txSheet').classList.remove('hidden');}
function closeTx(){document.getElementById('txSheet').classList.add('hidden');}
function saveTx(){let amt=parseFloat(document.getElementById('txAmt').value)||0;if(!amt)return;let dept=document.getElementById('txDept').value,biz=document.getElementById('txBiz').value,note=document.getElementById('txNote').value||curType,receipt=document.getElementById('txReceipt').value||note;DB.tx.unshift({id:Date.now(),dept,business:biz,amt,note,type:curType,ts:Date.now(),receipt});if(curType==='income')DB.depts[dept].bal+=amt;else DB.depts[dept].bal-=amt;save();closeTx();renderAll();}
function switchStaffTab(d,el){curStaffTab=d;DB.curStaffDept=d;document.querySelectorAll('.staff-tab').forEach(b=>{b.className='staff-tab bg-[#1A1A1A] border px-4 py-2 rounded-full text-[11px]';});el.className='staff-tab on bg-white text-black px-4 py-2 rounded-full text-[11px] font-bold';renderTeam();save();}
function renderTeam(){let q=(document.getElementById('staffSearch')?.value||'').toLowerCase();let filtered=DB.staff.filter(s=>s.dept===curStaffTab && (`${s.name} ${s.business} ${s.phone}`.toLowerCase().includes(q)));let byBusiness={};filtered.forEach(s=>{if(!byBusiness[s.business])byBusiness[s.business]=[];byBusiness[s.business].push(s);});let allGross=DB.staff.reduce((a,b)=>a+(b.salary||0),0);document.getElementById('totalStaff').innerText=DB.staff.length;document.getElementById('totalPayroll').innerText=fmt(allGross);document.getElementById('totalTier2').innerText=fmt(allGross*0.05);document.getElementById('totalSSNIT1').innerText=fmt(DB.staff.reduce((a,b)=>a+ghanaDeductions(b.salary||0).totalT1,0));document.getElementById('totalPAYE').innerText=fmt(DB.staff.reduce((a,b)=>a+ghanaDeductions(b.salary||0).paye,0));document.getElementById('totalNetPay').innerText=fmt(DB.staff.reduce((a,b)=>a+ghanaDeductions(b.salary||0).net,0));document.getElementById('teamActiveCard').innerHTML=`<div class="flex justify-between"><div><div class="font-bold">${DEPT_FULL[curStaffTab]}</div><div class="text-[8px] text-zinc-500">${filtered.length} staff • ADMIN is just admin</div></div><div class="font-bold">${fmt(filtered.reduce((a,b)=>a+(b.salary||0),0))}</div></div>`;let html='';for(let biz in byBusiness){html+=`<div class="mt-4"><div class="text-[9px] text-zinc-400 font-mono">${biz.toUpperCase()} • ${byBusiness[biz].length}</div><div class="mt-2 bg-[#121212] border rounded-2xl overflow-hidden"><div class="grid grid-cols-12 bg-[#080808] px-3 py-2 text-[7px] text-zinc-500 font-mono"><div class="col-span-4">NAME</div><div class="col-span-2">DEPT</div><div class="col-span-3">BUSINESS</div><div class="col-span-2">PHONE</div><div class="col-span-1">EDIT</div></div>`;byBusiness[biz].forEach(s=>{let d=ghanaDeductions(s.salary||0);html+=`<div class="grid grid-cols-12 px-3 py-3 border-t border-[#1A1A1A] text-[11px]"><div class="col-span-4 font-bold truncate">${s.name}<div class="text-[8px] text-zinc-500 font-mono">${s.position}</div></div><div class="col-span-2 text-[9px] font-mono">${s.dept}</div><div class="col-span-3 text-[9px] font-mono truncate">${s.business}</div><div class="col-span-2 text-[9px] font-mono">${s.phone}</div><div class="col-span-1"><button onclick="openStaffForm(${s.id})" class="bg-[#1A1A1A] border rounded-full px-2 py-1 text-[8px]">EDIT</button></div></div><div class="px-3 pb-2 grid grid-cols-4 gap-1"><div class="bg-[#080808] rounded p-1 text-[7px] font-mono">GROSS ${s.salary}</div><div class="bg-[#080808] rounded p-1 text-[7px] font-mono text-blue-300">T2 ${d.tier2.toFixed(0)}</div><div class="bg-[#080808] rounded p-1 text-[7px] font-mono text-red-300">TAX ${d.paye}</div><div class="bg-[#080808] rounded p-1 text-[7px] font-mono text-emerald-400">NET ${d.net}</div></div>`;});html+=`</div></div>`;}document.getElementById('teamCategorized').innerHTML=html||`<div class="text-center p-6 text-[11px] text-zinc-600">No staff</div>`;}
function openStaffForm(id){editingStaff=id?DB.staff.find(s=>s.id===id):null;document.getElementById('staffSheet').classList.remove('hidden');if(editingStaff){document.getElementById('s-name').value=editingStaff.name;document.getElementById('s-dept').value=editingStaff.dept;document.getElementById('s-business').value=editingStaff.business;document.getElementById('s-position').value=editingStaff.position;document.getElementById('s-phone').value=editingStaff.phone;document.getElementById('s-salary').value=editingStaff.salary;}else{document.getElementById('s-name').value='';document.getElementById('s-business').value='';document.getElementById('s-position').value='';document.getElementById('s-phone').value='';document.getElementById('s-salary').value='';document.getElementById('s-dept').value=curStaffTab;}}
function closeStaffForm(){document.getElementById('staffSheet').classList.add('hidden');}
function saveStaffForm(){let data={name:document.getElementById('s-name').value.trim(),dept:document.getElementById('s-dept').value,business:document.getElementById('s-business').value.trim()||'General',position:document.getElementById('s-position').value.trim()||'Staff',phone:document.getElementById('s-phone').value.trim()||'N/A',salary:Number(document.getElementById('s-salary').value)||0};if(!data.name)return alert('Name needed');if(editingStaff)Object.assign(editingStaff,data);else{data.id=Date.now();DB.staff.push(data);}closeStaffForm();save();renderTeam();renderAll();}
function switchAudit(t,el){curAudit=t;document.querySelectorAll('.audit-tab').forEach(b=>{b.className='audit-tab flex-1 py-2 rounded-full text-[11px] font-bold bg-[#1A1A1A] border';});el.className='audit-tab on flex-1 py-2 rounded-full text-[11px] font-bold bg-white text-black';renderAudit();}
function renderAudit(){let mv=document.getElementById('auditMonth').value,yv=document.getElementById('auditYear').value,dv=document.getElementById('auditDept').value;let f=DB.tx.filter(t=>{let dt=new Date(t.ts);if(mv!=='all'&&dt.getMonth()!=parseInt(mv))return false;if(yv!=='all'&&dt.getFullYear()!=parseInt(yv))return false;if(dv!=='all'&&t.dept!==dv)return false;return true;}).sort((a,b)=>b.ts-a.ts);document.getElementById('auditList').innerHTML=f.map(t=>`<div onclick="openReceipt('${t.id}')" class="bg-[#121212] border rounded-2xl p-4 flex justify-between"><div><div class="font-bold text-[12px]">${t.note}</div><div class="text-[8px] text-zinc-500 font-mono">${new Date(t.ts).toLocaleDateString()} • ${t.dept} • ${t.business} • Tap to open receipt</div></div><div class="font-bold text-[11px] ${t.type==='income'?'text-emerald-400':'text-red-400'}">${fmt(t.amt)}</div></div>`).join('')||'<div class="text-center p-6 text-zinc-600">No txns</div>';}
function renderAll(){let cash=Object.values(DB.depts).reduce((a,b)=>a+(b.bal||0),0);document.getElementById('netPos').innerText=fmt(cash);document.getElementById('payrollSum').innerText=`Gross ${fmt(DB.staff.reduce((a,b)=>a+(b.salary||0),0))} • Tier2 ${fmt(DB.staff.reduce((a,b)=>a+(b.salary||0),0)*0.05)} • Tax ${fmt(DB.staff.reduce((a,b)=>a+ghanaDeductions(b.salary||0).paye,0))}`;document.getElementById('txList').innerHTML=DB.tx.slice(0,10).map(t=>`<div class="flex justify-between bg-[#080808] border rounded-xl p-3"><div><div class="font-bold text-[11px]">${t.note}</div><div class="text-[8px] text-zinc-500 font-mono">${t.dept}</div></div><div class="font-bold text-[11px]">${fmt(t.amt)}</div></div>`).join('')||'<div class="text-center p-6 text-zinc-600 text-[11px]">No txns</div>';renderDeptPage();renderTeam();renderAudit();}
function openReceipt(id){let t=DB.tx.find(x=>String(x.id)===String(id));if(!t)return;document.getElementById('receiptContent').innerHTML=`<div class="text-[9px] text-zinc-500 font-mono">${new Date(t.ts).toLocaleString()}</div><div class="font-bold text-[16px] mt-1">${t.note}</div><div class="font-bold mt-2">${fmt(t.amt)}</div><div class="mt-4 bg-[#F5F5F5] rounded-2xl p-4 text-[11px] font-mono whitespace-pre-wrap">${t.receipt}</div>`;document.getElementById('receiptModal').classList.remove('hidden');}
renderAll();
</script>
</body>
